# Blueprint de Render (Sprint 9.4) — plan gratuito.
# Variables con "sync: false" se configuran a mano en el dashboard de
# Render, nunca en este archivo (secretos reales no se commitean).
# Ver README.md, sección "Desplegar a Render", para la guía paso a paso.

services:
  - type: web
    name: almuerzo-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        sync: false
      - key: MIGRATE_DATABASE_URL
        sync: false
      - key: PLATFORM_DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        sync: false
